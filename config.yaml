version: "2.1.0"

server:
  host: "127.0.0.1"
  port: 7869
  auto_load_model: true
  # SSL configuration (currently not active - server runs on HTTP)
  # To enable HTTPS, configure uvicorn in clean_launch.py with ssl_certfile/ssl_keyfile
  ssl:
    certfile: "bin/cert.pem"
    keyfile: "bin/key.pem"

models:
  voxcpm2:
    model_path: "pretrained_models/VoxCPM2"
    asr_path: "pretrained_models/SenseVoiceSmall"
    denoiser_path: "pretrained_models/speech_zipenhancer"
  # 声明式引擎注册表（对齐 VoiceBox ModelConfig 设计）
  # 新引擎只需在此声明即可自动注册、显存预检和 UI 渲染
  engines:
    voxcpm2:
      name: "voxcpm2"
      display_name: "VoxCPM2"
      model_dir: "VoxCPM2"
      vram_gb: 6.5
      ram_gb: 16.0
      languages: ["zh", "en", "ja", "ko", "ar", "de", "es", "fr", "hi", "it", "nl", "pl", "pt", "ru", "sv", "tr", "vi", "bn", "fa", "sw", "tl", "ur", "my", "ta", "th", "cs", "el", "hu", "ro", "uk"]
      quality: "high"
      license: "Apache-2.0"
      supported_features: ["voice_design", "clone", "ultimate", "script", "streaming", "lora"]
      sample_rate: 48000
      requires_gpu: true
    indextts2:
      name: "indextts2"
      display_name: "IndexTTS 2.0"
      model_dir: "IndexTTS2"
      vram_gb: 6.0
      ram_gb: 16.0
      languages: ["zh", "en"]
      quality: "high"
      license: "MIT"
      supported_features: ["clone", "emotion_control"]
      sample_rate: 24000
      requires_gpu: true
    dotstts:
      name: "dotstts"
      display_name: "dots.tts"
      hf_repo: "dots-studio/dots.tts-base"
      model_dir: "dots.tts"
      vram_gb: 8.0
      ram_gb: 16.0
      languages: ["zh", "en"]
      quality: "high"
      license: "Apache-2.0"
      supported_features: ["clone"]
      sample_rate: 48000
      requires_gpu: true

generation:
  cfg_value: 2.0
  inference_timesteps: 10
  normalize: true
  denoise: true
  retry_badcase: true
  retry_badcase_max_times: 3
  retry_badcase_ratio_threshold: 6.0
  min_len: 2
  max_len: 4096
  split_max_chars: 200
  # RAS 段级重复检测（参考 Fish Speech Repetition Aware Sampling）
  enable_ras: false
  ras_max_retries: 2
  ras_cfg_increase: 0.5
  # Emotion tag system (inspired by Fish Speech)
  emotion_tags_enabled: true
  emotion_tags_strip_for_engine: false  # Keep tags in text for engine processing
  # Neural watermarking (inspired by Chatterbox Perth)
  watermark_enabled: false
  watermark_source_id: "tts-multimodel"
  watermark_strength: 0.008

# vLLM acceleration (optional, requires pip install vllm>=0.6.0)
vllm:
  enabled: false
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.85
  max_model_len: 4096
  dtype: "auto"
  enable_prefix_caching: true

cache:
  persona_max_size: 50
  persona_max_vram_mb: 512
  idle_timeout_s: 300

environment:
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_OFFLINE: "1"
  MODELSCOPE_OFFLINE: "1"

api_auth:
  enabled: false
  token: ""

# SSE 事件流配置
sse:
  active_interval: 0.3
  idle_base_interval: 0.5
  idle_max_interval: 3.0
  idle_step: 0.5
  heartbeat_interval: 30.0

# 音频播放器配置
audio_player:
  waveform_steps: 300
  default_sample_rate: 44100
  progress_update_ms: 100

# UI 布局配置
ui:
  sidebar_width: 240
  sidebar_collapsed_width: 52

# PWA (Progressive Web App) 离线优先配置
# Refs: docs/ROADMAP.md §5.5 stage E, docs/STAGE_E_EXECUTION_PLAN.md TB.6
pwa:
  enabled: true
  cache_version: "v3"  # Phase 3+4: 升级到 v3 触发旧缓存清理 + 启用 push/sync
  offline_enabled: true
  scope: "/"
  api_cache_max_age_s: 300
  html_cache_max_entries: 50
  precache_urls:
    - "/"
    - "/favicon.ico"
    - "/manifest.json"
    - "/static_pwa/js/idb_cache.js"  # Phase 2: SW importScripts 依赖
  # Phase 3 推送通知：VAPID 密钥
  # 安全：密钥通过 .env 环境变量注入，请勿在此填写！
  # 生成密钥：python scripts/generate_vapid_keys.py
  # 配置方法：复制 .env.example 为 .env，填入生成的密钥
  vapid_public_key: ""   # 或设环境变量 VAPID_PUBLIC_KEY
  vapid_private_key: ""  # 或设环境变量 VAPID_PRIVATE_KEY
  vapid_subject: ""      # 或设环境变量 VAPID_SUBJECT
  # ===== Phase 2: IndexedDB 音频缓存 =====
  # 详细设计见 docs/STAGE_E_PWA_PHASE2.md
  # 硬约束：cache_version 与 sw.js 顶部 VERSION 常量保持同步
  idb_audio_cache: true           # 用户决策：仅本地生成音频，100MB 保守
  idb_max_size_mb: 100            # 超出触发 LRU 清理到 idb_lru_target_pct
  idb_lru_target_pct: 80          # 清理后保留 80% 容量作为缓冲
  idb_broadcast_channel: true     # 跨标签页事件通知
  idb_persist_request: true       # 调 navigator.storage.persist() 请求持久化
  # ===== Phase 4: Background Sync 离线生成队列 =====
  background_sync: true            # SW sync 事件 + IndexedDB 任务队列
