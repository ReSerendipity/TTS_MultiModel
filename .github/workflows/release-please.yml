name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: python
          package-name: tts-multimodel
          # Read changelog from CHANGELOG.md
          changelog-path: CHANGELOG.md
          # Use Conventional Commits
          include-component-in-tag: false
          # Don't release automatically; create PR for review
          target-branch: main
          # Release as draft for manual approval
          draft: false
          # PR labels
          label: release
          # Skip CI on release commits
          prerelease: false

  # After release is created, build and upload artifacts
  build-release:
    name: Build Release Artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          generate_release_notes: true
