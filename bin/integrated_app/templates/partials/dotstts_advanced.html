{# dots.tts Advanced Parameters Panel - Collapsible #}
{# 使用方式: {% include 'partials/dotstts_advanced.html' with context %}  #}
{# 暴露字段: name="num_steps"/"guidance_scale"/"seed"/"random_seed"/"language" #}

<div style="margin-top:8px">
    <div class="collapse-header" onclick="toggleCollapse(this)">
        <span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            {{ "dotstts_advanced_params"|t(lang) }}
        </span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="collapse-body">
        <div style="font-size:11px;color:var(--text-tertiary);margin:8px 0 4px">{{ "dotstts_quality_hint"|t(lang) }}</div>
        <div class="form-row" style="margin-top:4px">
            <div class="form-col">
                <label class="fl" for="dts-num-steps">{{ "dotstts_num_steps"|t(lang) }}</label>
                <input type="number" id="dts-num-steps" name="num_steps" class="fi" value="10" min="1" max="32" step="1">
            </div>
            <div class="form-col">
                <label class="fl" for="dts-guidance">{{ "dotstts_guidance_scale"|t(lang) }}</label>
                <input type="number" id="dts-guidance" name="guidance_scale" class="fi" value="1.2" min="0.5" max="3.0" step="0.05">
            </div>
        </div>
        <div class="form-row">
            <div class="form-col">
                <label class="fl" for="dts-seed">{{ "dotstts_seed"|t(lang) }}</label>
                <input type="number" id="dts-seed" name="seed" class="fi" value="42" min="0" max="2147483647" step="1" {% if is_rand %}disabled{% endif %}>
            </div>
            <div class="form-col">
                <label class="fl" for="dts-rand">{{ "dotstts_random_seed"|t(lang) }}</label>
                <select id="dts-rand" name="random_seed" class="fs" onchange="document.getElementById('dts-seed').disabled=this.value==='true'">
                    <option value="true" selected>{{ "enabled"|t(lang) }}</option>
                    <option value="false">{{ "disabled"|t(lang) }}</option>
                </select>
            </div>
        </div>
        <div class="form-row" style="margin-bottom:0">
            <div class="form-col">
                <label class="fl" for="dts-lang">{{ "dotstts_language"|t(lang) }}</label>
                <select id="dts-lang" name="language" class="fs">
                    <option value="auto" selected>Auto</option>
                    <option value="zh">中文</option>
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                </select>
            </div>
            <div class="form-col"></div>
        </div>
    </div>
</div>
